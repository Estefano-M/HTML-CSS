<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Login Responsivo - </title>
    <link rel="stylesheet" href="mobileFirst.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
</head>
<body>
    <main>
        <h1>Login</h1>
        <p>
            Seja Bem-Vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
        </p>
        <form action="informacoes-de-login.php" method="post" autocomplete="on">
            <p>
                <label for="iusername">
                    <span class="material-symbols-outlined" id="profile-icon">account_circle</span>
                    <input type="text" name="username" id="iusername" placeholder="insira seu e-mail" required>
                </label>
            </p>
            <p>
                <label for="ipassword">#</label>
                <input type="password" name="userpassword" id="ipassword" placeholder="mínimo 8 caracterers" required>
            </p>
            <input type="submit" value="Entrar" id="entrar">
            <p><input type="reset" value="Esqueci a senha" id="esqueci-senha"></p>
        </form>
    </main>
</body>
</html>
