<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/Capítulo-01/imagens/-Area-Barrier-Build.32.png" type="image/x-icon">
    <title>- Input Email Tel - </title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <h1>- Input Email Tel - 006</h1>

    <form action="/formcontrol.php" autocomplete="on" method="get">
        <fieldset>
            <legend>Dados do Usuário</legend>
            <p>
                <label for="iusername">Nome Completo:</label>
                <input type="text" name="username" id="iusername" required autocomplete="name" maxlength="30" placeholder="Nome Completo">
            </p>
            <p>
                <label for="iuseremail">E-mail:</label>
                <input type="email" name="useremail" id="iuseremail" required maxlength="40" placeholder="E-mail">
            </p>
            <p>
                <label for="iusercontact">Tel:</label>
                <input type="tel" name="usercontact" id="iusercontact" required placeholder="Numero de Telefone" maxlength="15">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>
</body>
</html>
