<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/Capítulo-01/imagens/-Area-Barrier-Build.32.png" type="image/x-icon">
    <title>- Element Number,etc - </title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <h1>- Element Number, Date, etc - 005</h1>

    <form action="/formcontrol.php" autocomplete="on" method="get">
        <p>
            <label for="inome">Nome Completo:</label>
            <input type="text" name="username" id="iusername" autocomplete="name" maxlength="30" required placeholder="Nome do Usuário">
        </p>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" max="10" min="0" placeholder="0 á 10" step="0.1" required>
        </p>
        <p>
            <label for="iperiodo">Período Letivo:</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <p>
            <label for="prova">Dia da Prova:</label>
            <input type="date" name="dataprova" id="iprova">
        </p>
        <P>
            <label for="ihora">Horário da Prova:</label>
            <input type="time" name="hora" id="ihora" required>
        </P>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>

</body>
</html>
