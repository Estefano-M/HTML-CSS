<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
    <style>
        .container{
            border: 01px solid red;
            height: 400px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            grid-auto-rows: 1fr;
            grid-auto-columns: 1fr;
            grid-auto-flow: row;

        }
        .item{
            border: 01px solid blue;
            padding: 05px;
        }
        .box1{
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;
            border: 01px dashed black;
        }
        .box2{
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
        }
        .box3{
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <article>
                <div class="container">
                    <div class="item">A</div>
                    <div class="item">B</div>
                    <div class="item">C</div>
                    <div class="item">D</div>
                    <div class="item">E</div>
                    <div class="item">F</div>
                    <div class="item">G</div>
                    <div class="item">H</div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
