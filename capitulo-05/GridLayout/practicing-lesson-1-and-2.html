<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicing</title>
    <style>
        .container{
            border: 01px solid blue;
            height: 300px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 10px;
            /* Todas essas propriedades abaixo tem o mesmo padrão: "normal" ou "stretch" (é a mesma coisa).  */
            align-items: stretch;
            justify-items: stretch;
            align-content: stretch;
            justify-content: stretch;
        }
        .item{
            border: 01px solid red;
            padding: 05px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <article>
                <div class="container">
                    <div class="item">A</div>
                    <div class="item">B</div>
                    <div class="item">C</div>
                    <div class="item">D</div>
                    <div class="item">E</div>
                    <div class="item">F</div>
                    <div class="item">G</div>
                    <div class="item">H</div>
                </div>
            </article>
        </section>
        <section>
            <p>Nesse exercício, a gente fez os testes de cada propriedade e olhamos o resultado de cada valor. <br>Caso queira ver o vídeo dessa aula para ver novamente, eu salvei na aba do Guanabara e eis aqui também o link para o vídeo: &downarrow;</p>
            <a href="https://www.youtube.com/watch?v=k3wb4g6exi8" target="_blank" rel="external">CSS Grid Layout na Prática part 2</a>
        </section>
    </main>
</body>
</html>
