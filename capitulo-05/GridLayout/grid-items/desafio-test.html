<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            display: grid;
            grid-template: 170px 60px 300px 40px / 3fr 1fr;
            gap: 02px;
            text-align: center;
        }
        .caixa{
            border: 01px solid red;
            background-color: lightgray;
        }
        #topo{
            align-content: center;
            grid-area: 1 / 1 / 2 / span 2;
        }
        #menu{
            align-content: center;
            grid-area: 2 / 1 / 3 / -1;
        }
        #principal{
            align-content: center;
            grid-area: 3 / 1 / 4 / -2;
        }
        #secundario{
            align-content: center;
            grid-area: -3 / -2 / -2 / -1;
        }
        #rodape{
            align-content: center;
            grid-area: 4 / 1 / 5 / -1;
        }
    </style>
</head>
<body>
    <main>
        <section>
                <header class="caixa" id="topo">
                    Header
                </header>
                <nav class="caixa" id="menu">
                    Nav
                </nav>
                <article class="caixa" id="principal">
                    Article
                </article>
                <aside class="caixa" id="secundario">
                    Aside
                </aside>
                <footer class="caixa" id="rodape">
                    Footer
                </footer>
        </section>
    </main>
</body>
</html>
