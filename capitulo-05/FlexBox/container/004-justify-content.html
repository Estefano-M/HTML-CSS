<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Align Axis FlexBox -</title>
    <style>
        #container{
            background-color: bisque;
            display: flex;
            flex-flow: row nowrap;

        }
        .item{
            
            background-color: cornflowerblue;
            border: 01px solid black;
            padding: 10px;
            text-align: center;
        }

</head>
<body>
    <main id="container">
        <div class="item">Exemplo A</div>
        <div class="item">Exemplo B</div>
        <div class="item">Exemplo C</div>
        <div class="item">Exemplo D</div>
        <div class="item">Exemplo E</div>
        <div class="item">Exemplo F</div>
        <div class="item">Exemplo G</div>
        <div class="item">Exemplo H</div>
    </main>
</body>
</html>
