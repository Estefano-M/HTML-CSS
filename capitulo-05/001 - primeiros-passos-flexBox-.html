<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- Flexible Box -</title>
    <style>
        div.conteiner{
            background-color: blue;
            display: flex;
            
        }
        div.item{
            background-color: yellow;
            border: 01px solid black;
            flex: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    <p>
        Lembrando que  sempre que for usar o <strong><mark>&gt;;display: flex&lt;</mark></strong>, coloque sempre o <strong>display flex no pai(container)!!</strong><br> Nesse exemplo aqui, usamos o display flex no <strong>container</strong> e depois no <q>filho</q>(ou item), coloquei o <strong><mark>&gt;flex: auto&lt;</mark>! <br> Ao fazer isso, deixei o <strong>ITEM</strong> com o tamanho do <strong>CONTAINER</strong>!</strong>
    </p>
</body>
</html>
